<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>WearOnOff Admin</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
    <script>
      const RENDER_DEPLOY_HOOK = 'REEMPLAZA_CON_TU_DEPLOY_HOOK';
      const DEPLOY_COOLDOWN_MS = 90000;

      window.addEventListener('load', () => {
        setTimeout(() => {
          const deployButton = document.createElement('button');
          deployButton.textContent = 'Deploy a Producción';
          deployButton.style.cssText = [
            'position:fixed',
            'bottom:24px',
            'right:24px',
            'background:#10b981',
            'color:#fff',
            'border:none',
            'padding:14px 24px',
            'border-radius:8px',
            'cursor:pointer',
            'font-weight:600',
            'font-size:14px',
            'transition:all .2s',
            'box-shadow:0 4px 12px rgba(16,185,129,.3)',
            'z-index:9999',
          ].join(';');

          function cooldownActive() {
            const last = localStorage.getItem('lastDeployTime');
            if (!last) return false;
            const remaining = DEPLOY_COOLDOWN_MS - (Date.now() - parseInt(last, 10));
            if (remaining <= 0) return false;
            deployButton.disabled = true;
            deployButton.style.cursor = 'not-allowed';
            deployButton.style.background = '#6b7280';
            const tick = () => {
              const left = DEPLOY_COOLDOWN_MS - (Date.now() - parseInt(last, 10));
              if (left > 0) {
                deployButton.textContent = `Espera ${Math.ceil(left / 1000)}s`;
                setTimeout(tick, 1000);
              } else {
                deployButton.disabled = false;
                deployButton.style.cursor = 'pointer';
                deployButton.style.background = '#10b981';
                deployButton.textContent = 'Deploy a Producción';
              }
            };
            tick();
            return true;
          }

          cooldownActive();

          deployButton.onclick = async () => {
            if (RENDER_DEPLOY_HOOK === 'REEMPLAZA_CON_TU_DEPLOY_HOOK') {
              alert('Configura RENDER_DEPLOY_HOOK en public/cms/index.html');
              return;
            }
            if (cooldownActive()) {
              alert('Espera un momento antes de volver a desplegar.');
              return;
            }
            if (!confirm('¿Desplegar los cambios a producción?')) return;

            deployButton.disabled = true;
            deployButton.textContent = 'Desplegando...';
            deployButton.style.background = '#6b7280';
            deployButton.style.cursor = 'not-allowed';

            try {
              await fetch(RENDER_DEPLOY_HOOK, { method: 'POST', mode: 'no-cors' });
              localStorage.setItem('lastDeployTime', Date.now().toString());
              deployButton.textContent = 'Deploy iniciado';
              alert('Deploy iniciado. El sitio se actualizará en unos minutos.');
              setTimeout(cooldownActive, 2000);
            } catch (error) {
              deployButton.textContent = 'Error';
              deployButton.style.background = '#ef4444';
              setTimeout(() => {
                deployButton.textContent = 'Deploy a Producción';
                deployButton.style.background = '#10b981';
                deployButton.disabled = false;
                deployButton.style.cursor = 'pointer';
              }, 3000);
              alert('Error de red al iniciar el deploy.');
            }
          };

          document.body.appendChild(deployButton);
        }, 1000);
      });
    </script>
  </body>
</html>
